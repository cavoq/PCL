  # No unknown critical CRL extensions (RFC 5280 5.2)
  - id: crl-no-unknown-critical-extensions
    reference: RFC5280 5.2, 5.3
    target: crl
    operator: noUnknownCriticalExtensions
    requirement: must

  # -------------------------------------------------
  # CRL Entry Extensions (Section 5.3)
  # -------------------------------------------------

  # reasonCode is optional. Strict adapter parsing owns the canonical
  # ENUMERATED validation so policy does not duplicate the value table.
  - id: crl-entry-reason-valid
    reference: RFC5280 5.3.1
    when:
      target: crl.revokedCertificates
      operator: present
    target: crl.revokedCertificates
    operator: every
    operands:
      - path: extensions.2.5.29.21.malformed
        check: absent
        skipMissing: true
    requirement: must

  - id: crl-entry-reason-not-critical
    reference: RFC5280 5.3.1
    when:
      target: crl.revokedCertificates
      operator: present
    target: crl.revokedCertificates
    operator: every
    operands:
      - path: extensions.2.5.29.21.critical
        check: eq
        values: [false]
        skipMissing: true
    requirement: must

  - id: crl-entry-reason-not-unspecified
    reference: RFC5280 5.3.1
    when:
      target: crl.revokedCertificates
      operator: present
    target: crl.revokedCertificates
    operator: every
    operands:
      - path: extensions.2.5.29.21.value
        operator: neq
        operands: [0]
        skipMissing: true
    requirement: should
    message: "Omit reasonCode instead of using unspecified (0)"

  - id: crl-entry-invalidity-date-well-formed
    reference: RFC5280 5.3.2
    when:
      target: crl.revokedCertificates
      operator: present
    target: crl.revokedCertificates
    operator: every
    operands:
      - path: extensions.2.5.29.24.malformed
        check: absent
        skipMissing: true
    requirement: must

  - id: crl-entry-invalidity-date-not-critical
    reference: RFC5280 5.3.2
    when:
      target: crl.revokedCertificates
      operator: present
    target: crl.revokedCertificates
    operator: every
    operands:
      - path: extensions.2.5.29.24.critical
        check: eq
        values: [false]
        skipMissing: true
    requirement: must

  - id: crl-entry-certificate-issuer-well-formed
    reference: RFC5280 5.3.3
    when:
      target: crl.revokedCertificates
      operator: present
    target: crl.revokedCertificates
    operator: every
    operands:
      - path: extensions.2.5.29.29.malformed
        check: absent
        skipMissing: true
    requirement: must

  - id: crl-entry-certificate-issuer-critical
    reference: RFC5280 5.3.3
    when:
      target: crl.revokedCertificates
      operator: present
    target: crl.revokedCertificates
    operator: every
    operands:
      - path: extensions.2.5.29.29.critical
        check: eq
        values: [true]
        skipMissing: true
    requirement: must

  # -------------------------------------------------
  # Subject DN Field Length Limits (RFC 5280 Appendix A)
  # -------------------------------------------------

  # commonName max 64 characters (RFC 5280)
  - id: subject-cn-max-length
    reference: RFC5280 Appendix A.1
    when:
      target: certificate.subject.commonName
      operator: present
    target: certificate.subject.commonName
    operator: every
    operands:
      - path: value
        operator: maxLength
        operands: [64]
    requirement: must
    message: "commonName must not exceed 64 characters"
    certType: [leaf, intermediate]

  # organizationName max 64 characters (RFC 5280)
  - id: subject-org-max-length
    reference: RFC5280 Appendix A.1
    when:
      target: certificate.subject.organizationName
      operator: present
    target: certificate.subject.organizationName
    operator: every
    operands:
      - path: value
        operator: maxLength
        operands: [64]
    requirement: must
    message: "organizationName must not exceed 64 characters"
    certType: [leaf, intermediate]

  # organizationalUnitName max 64 characters (RFC 5280)
  - id: subject-ou-max-length
    reference: RFC5280 Appendix A.1
    when:
      target: certificate.subject.organizationalUnitName
      operator: present
    target: certificate.subject.organizationalUnitName
    operator: every
    operands:
      - path: value
        operator: maxLength
        operands: [64]
    requirement: must
    message: "organizationalUnitName must not exceed 64 characters"
    certType: [leaf, intermediate]

  # localityName max 128 characters (RFC 5280)
  - id: subject-locality-max-length
    reference: RFC5280 Appendix A.1
    when:
      target: certificate.subject.localityName
      operator: present
    target: certificate.subject.localityName
    operator: every
    operands:
      - path: value
        operator: maxLength
        operands: [128]
    requirement: must
    message: "localityName must not exceed 128 characters"
    certType: [leaf, intermediate]

  # stateOrProvinceName max 128 characters (RFC 5280)
  - id: subject-state-max-length
    reference: RFC5280 Appendix A.1
    when:
      target: certificate.subject.stateOrProvinceName
      operator: present
    target: certificate.subject.stateOrProvinceName
    operator: every
    operands:
      - path: value
        operator: maxLength
        operands: [128]
    requirement: must
    message: "stateOrProvinceName must not exceed 128 characters"
    certType: [leaf, intermediate]

  # countryName exactly 2 characters (ISO 3166-1)
  - id: subject-country-length
    reference: RFC5280 Appendix A.1 + ISO 3166-1
    when:
      target: certificate.subject.countryName
      operator: present
    target: certificate.subject.countryName
    operator: every
    operands:
      - path: value
        operator: maxLength
        operands: [2]
    requirement: must
    message: "countryName must be exactly 2 characters (ISO 3166-1)"
    certType: [leaf, intermediate]

  - id: subject-country-min-length
    reference: RFC5280 Appendix A.1 + ISO 3166-1
    when:
      target: certificate.subject.countryName
      operator: present
    target: certificate.subject.countryName
    operator: every
    operands:
      - path: value
        operator: minLength
        operands: [2]
    requirement: must
    message: "countryName must be exactly 2 characters (ISO 3166-1)"
    certType: [leaf, intermediate]

  # serialNumber (subject) max 64 characters (RFC 5280 Appendix A.1)
  - id: subject-serial-number-max-length
    reference: RFC5280 Appendix A.1
    when:
      target: certificate.subject.serialNumber
      operator: present
    target: certificate.subject.serialNumber
    operator: every
    operands:
      - path: value
        operator: maxLength
        operands: [64]
    requirement: must
    message: "subject serialNumber must not exceed 64 characters"
    certType: [leaf, intermediate]

  # givenName uses X520name with ub-name 32768 (RFC 5280 Appendix A.1)
  - id: subject-givenname-max-length
    reference: RFC5280 Appendix A.1
    when:
      target: certificate.subject.givenName
      operator: present
    target: certificate.subject.givenName
    operator: every
    operands:
      - path: value
        operator: maxLength
        operands: [32768]
    requirement: must
    message: "givenName must not exceed 32768 characters"
    certType: [leaf, intermediate]

  # surname uses X520name with ub-name 32768 (RFC 5280 Appendix A.1)
  - id: subject-surname-max-length
    reference: RFC5280 Appendix A.1
    when:
      target: certificate.subject.surname
      operator: present
    target: certificate.subject.surname
    operator: every
    operands:
      - path: value
        operator: maxLength
        operands: [32768]
    requirement: must
    message: "surname must not exceed 32768 characters"
    certType: [leaf, intermediate]

  # emailAddress in subject max 255 characters (RFC 5280)
  - id: subject-email-max-length
    reference: RFC5280 Appendix A.1
    when:
      target: certificate.subject.emailAddress
      operator: present
    target: certificate.subject.emailAddress
    operator: every
    operands:
      - path: value
        operator: maxLength
        operands: [255]
    requirement: must
    message: "subject emailAddress must not exceed 255 characters"
    certType: [leaf, intermediate]

  # rfc822Name holds a Mailbox (RFC 5280 4.2.1.6, RFC 2821 4.1.2); the check is
  # a shape check, not full mailbox parsing.
  - id: san-rfc822-name-format
    reference: RFC5280 4.2.1.6
    when:
      target: certificate.subjectAltName.rfc822Name
      operator: present
    target: certificate.subjectAltName.rfc822Name
    operator: every
    operands:
      - operator: regex
        operands: ["^[^@]+@[^@]+$"]
    requirement: must
    message: "SAN rfc822Name must be a mailbox"
    certType: [leaf]

  # Issuer alternative names are encoded as subject alternative names
  # (RFC 5280 4.2.1.7).
  - id: ian-rfc822-name-format
    reference: RFC5280 4.2.1.7, 4.2.1.6
    when:
      target: certificate.issuerAltName.rfc822Name
      operator: present
    target: certificate.issuerAltName.rfc822Name
    operator: every
    operands:
      - operator: regex
        operands: ["^[^@]+@[^@]+$"]
    requirement: must
    message: "IAN rfc822Name must be a mailbox"

  - id: ian-dns-valid-label
    reference: RFC5280 4.2.1.7, 4.2.1.6
    when:
      target: certificate.issuerAltName.dNSName
      operator: present
    target: certificate.issuerAltName.dNSName
    operator: every
    operands:
      - operator: regex
        operands: ["^(\\*\\.)?([A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?\\.)*[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?$"]
    requirement: must
    message: "IAN dNSName must be in the preferred name syntax"

  # A domainComponent holds one DNS label after ToASCII, which limits it to 63
  # characters (RFC 5280 7.3, RFC 3490 4.1).
  - id: subject-dc-label-max-length
    reference: RFC5280 7.3; RFC 3490 4.1
    when:
      target: certificate.subject.domainComponent
      operator: present
    target: certificate.subject.domainComponent
    operator: every
    operands:
      - path: value
        operator: maxLength
        operands: [63]
    requirement: must
    message: "Each domainComponent label must not exceed 63 characters"
    certType: [leaf, intermediate]

  # -------------------------------------------------
  # Time Format Validation (RFC 5280 4.1.2.5)
  # -------------------------------------------------

  # Dates through 2049 MUST use UTCTime; dates in 2050 or later MUST use
  # GeneralizedTime.
  - id: validity-notbefore-utctime-through-2049
    reference: RFC5280 4.1.2.5
    when:
      target: certificate.validity.notBefore
      operator: before
      operands: ["2050-01-01T00:00:00Z"]
    target: certificate.validity.notBefore.encoding
    operator: eq
    operands: [23]
    requirement: must
    certType: [leaf, intermediate, root]

  - id: validity-notbefore-generalizedtime-from-2050
    reference: RFC5280 4.1.2.5
    when:
      target: certificate.validity.notBefore
      operator: onOrAfter
      operands: ["2050-01-01T00:00:00Z"]
    target: certificate.validity.notBefore.encoding
    operator: eq
    operands: [24]
    requirement: must
    certType: [leaf, intermediate, root]

  - id: validity-notafter-utctime-through-2049
    reference: RFC5280 4.1.2.5
    when:
      target: certificate.validity.notAfter
      operator: before
      operands: ["2050-01-01T00:00:00Z"]
    target: certificate.validity.notAfter.encoding
    operator: eq
    operands: [23]
    requirement: must
    certType: [leaf, intermediate, root]

  - id: validity-notafter-generalizedtime-from-2050
    reference: RFC5280 4.1.2.5
    when:
      target: certificate.validity.notAfter
      operator: onOrAfter
      operands: ["2050-01-01T00:00:00Z"]
    target: certificate.validity.notAfter.encoding
    operator: eq
    operands: [24]
    requirement: must
    certType: [leaf, intermediate, root]

  # UTCTime format: YYMMDDHHMMSSZ per RFC 5280 4.1.2.5.1
  # UTCTime MUST have seconds present (even if 00)
  - id: validity-utctime-has-seconds
    reference: RFC5280 4.1.2.5.1
    when:
      target: certificate.validity.notBefore.encoding
      operator: eq
      operands: [23]
    target: certificate.validity.notBefore.hasSeconds
    operator: eq
    operands: [true]
    requirement: must
    message: "UTCTime MUST include seconds per RFC 5280 4.1.2.5.1"
    certType: [leaf, intermediate, root]

  - id: validity-utctime-has-seconds-notafter
    reference: RFC5280 4.1.2.5.1
    when:
      target: certificate.validity.notAfter.encoding
      operator: eq
      operands: [23]
    target: certificate.validity.notAfter.hasSeconds
    operator: eq
    operands: [true]
    requirement: must
    message: "UTCTime MUST include seconds per RFC 5280 4.1.2.5.1"
    certType: [leaf, intermediate, root]

  # UTCTime MUST end with 'Z' (Zulu time indicator)
  - id: validity-utctime-has-zulu-notbefore
    reference: RFC5280 4.1.2.5.1
    when:
      target: certificate.validity.notBefore.encoding
      operator: eq
      operands: [23]
    target: certificate.validity.notBefore.hasZulu
    operator: eq
    operands: [true]
    requirement: must
    message: "UTCTime MUST end with 'Z' (Zulu indicator) per RFC 5280 4.1.2.5.1"
    certType: [leaf, intermediate, root]

  - id: validity-utctime-has-zulu-notafter
    reference: RFC5280 4.1.2.5.1
    when:
      target: certificate.validity.notAfter.encoding
      operator: eq
      operands: [23]
    target: certificate.validity.notAfter.hasZulu
    operator: eq
    operands: [true]
    requirement: must
    message: "UTCTime MUST end with 'Z' (Zulu indicator) per RFC 5280 4.1.2.5.1"
    certType: [leaf, intermediate, root]

  # GeneralizedTime MUST end with 'Z'
  - id: validity-generalizedtime-has-seconds-notbefore
    reference: RFC5280 4.1.2.5.2
    when:
      target: certificate.validity.notBefore.encoding
      operator: eq
      operands: [24]
    target: certificate.validity.notBefore.hasSeconds
    operator: eq
    operands: [true]
    requirement: must
    message: "GeneralizedTime MUST include seconds per RFC 5280 4.1.2.5.2"
    certType: [leaf, intermediate, root]

  - id: validity-generalizedtime-has-seconds-notafter
    reference: RFC5280 4.1.2.5.2
    when:
      target: certificate.validity.notAfter.encoding
      operator: eq
      operands: [24]
    target: certificate.validity.notAfter.hasSeconds
    operator: eq
    operands: [true]
    requirement: must
    message: "GeneralizedTime MUST include seconds per RFC 5280 4.1.2.5.2"
    certType: [leaf, intermediate, root]

  - id: validity-generalizedtime-has-zulu-notbefore
    reference: RFC5280 4.1.2.5.2
    when:
      target: certificate.validity.notBefore.encoding
      operator: eq
      operands: [24]
    target: certificate.validity.notBefore.hasZulu
    operator: eq
    operands: [true]
    requirement: must
    message: "GeneralizedTime MUST end with 'Z' per RFC 5280 4.1.2.5.2"
    certType: [leaf, intermediate, root]

  - id: validity-generalizedtime-has-zulu-notafter
    reference: RFC5280 4.1.2.5.2
    when:
      target: certificate.validity.notAfter.encoding
      operator: eq
      operands: [24]
    target: certificate.validity.notAfter.hasZulu
    operator: eq
    operands: [true]
    requirement: must
    message: "GeneralizedTime MUST end with 'Z' per RFC 5280 4.1.2.5.2"
    certType: [leaf, intermediate, root]

  # GeneralizedTime MUST NOT contain fractional seconds.
  - id: validity-generalizedtime-no-fraction
    reference: RFC5280 4.1.2.5.2
    when:
      target: certificate.validity.notBefore.encoding
      operator: eq
      operands: [24]
    target: certificate.validity.notBefore.hasFraction
    operator: eq
    operands: [false]
    requirement: must
    message: "GeneralizedTime MUST NOT include fractional seconds per RFC 5280"
    certType: [leaf, intermediate, root]

  - id: validity-generalizedtime-no-fraction-notafter
    reference: RFC5280 4.1.2.5.2
    when:
      target: certificate.validity.notAfter.encoding
      operator: eq
      operands: [24]
    target: certificate.validity.notAfter.hasFraction
    operator: eq
    operands: [false]
    requirement: must
    message: "GeneralizedTime MUST NOT include fractional seconds per RFC 5280"
    certType: [leaf, intermediate, root]

  # -------------------------------------------------
  # Encoding Validation (ASN.1 String Types)
  # -------------------------------------------------

  # Country name MUST use the PrintableString ASN.1 tag (RFC 5280 Appendix A.1)
  - id: subject-country-printable-string
    reference: RFC5280 Appendix A.1
    when:
      target: certificate.subject.countryName
      operator: present
    target: certificate.subject.countryName
    operator: every
    operands:
      - path: encoding
        operator: eq
        operands: [19]
    requirement: must
    message: "countryName must use PrintableString encoding"
    certType: [leaf, intermediate]

  # Common name uses DirectoryString: UTF8String, PrintableString, TeletexString,
  # UniversalString, or BMPString (RFC 5280 Appendix A.1)
  - id: subject-cn-valid-encoding
    reference: RFC5280 4.1.2.4, 4.1.2.6
    when:
      target: certificate.subject.commonName
      operator: present
    target: certificate.subject.commonName
    operator: every
    operands:
      - path: encoding
        operator: in
        operands: [12, 19]
    requirement: must
    message: "commonName must use PrintableString or UTF8String"
    certType: [leaf]

  # Other DirectoryString attributes of an end-entity subject. CA subjects may
  # keep the encoding of the issuer field of the certificates they issue
  # (4.1.2.4 exception a), so these target leaves.
  - id: subject-organization-valid-encoding
    reference: RFC5280 4.1.2.4, 4.1.2.6
    when:
      target: certificate.subject.organizationName
      operator: present
    target: certificate.subject.organizationName
    operator: every
    operands:
      - path: encoding
        operator: in
        operands: [12, 19]
    requirement: must
    message: "organizationName must use PrintableString or UTF8String"
    certType: [leaf]

  - id: subject-ou-valid-encoding
    reference: RFC5280 4.1.2.4, 4.1.2.6
    when:
      target: certificate.subject.organizationalUnitName
      operator: present
    target: certificate.subject.organizationalUnitName
    operator: every
    operands:
      - path: encoding
        operator: in
        operands: [12, 19]
    requirement: must
    message: "organizationalUnitName must use PrintableString or UTF8String"
    certType: [leaf]

  - id: subject-locality-valid-encoding
    reference: RFC5280 4.1.2.4, 4.1.2.6
    when:
      target: certificate.subject.localityName
      operator: present
    target: certificate.subject.localityName
    operator: every
    operands:
      - path: encoding
        operator: in
        operands: [12, 19]
    requirement: must
    message: "localityName must use PrintableString or UTF8String"
    certType: [leaf]

  - id: subject-state-valid-encoding
    reference: RFC5280 4.1.2.4, 4.1.2.6
    when:
      target: certificate.subject.stateOrProvinceName
      operator: present
    target: certificate.subject.stateOrProvinceName
    operator: every
    operands:
      - path: encoding
        operator: in
        operands: [12, 19]
    requirement: must
    message: "stateOrProvinceName must use PrintableString or UTF8String"
    certType: [leaf]

  # DNS names in SAN must be IA5String (ASCII)
  - id: san-dnsname-valid-ia5string
    reference: RFC5280 4.2.1.6
    when:
      target: certificate.subjectAltName.dNSName
      operator: present
    target: certificate.subjectAltName.dNSName
    operator: every
    operands:
      - operator: validIA5String
    requirement: must
    message: "DNS names in SAN must use IA5String encoding (ASCII only)"
    certType: [leaf]

  # RFC 5280 4.2.1.6: "When the subjectAltName extension contains a domain
  # name system label, the domain name MUST be stored in the dNSName (an
  # IA5String). The name MUST be in the "preferred name syntax", as specified
  # by Section 3.5 of [RFC1034] and as modified by Section 2.1 of [RFC1123]."
  # Labels are letters, digits and interior hyphens of at most 63 octets, so
  # an empty label, a leading period and an underscore are rejected. A
  # wildcard is accepted only as the complete leftmost label (RFC 9525).
  - id: san-dnsname-preferred-syntax
    reference: RFC5280 4.2.1.6
    when:
      target: certificate.subjectAltName.dNSName
      operator: present
    target: certificate.subjectAltName.dNSName
    operator: every
    operands:
      - operator: regex
        operands: ["^(\\*\\.)?([A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?\\.)*[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?$"]
    requirement: must
    message: "SAN dNSName must be in the preferred name syntax"

  # URIs in SAN must be IA5String (ASCII)
  - id: san-uri-valid-ia5string
    reference: RFC5280 4.2.1.6
    when:
      target: certificate.subjectAltName.uniformResourceIdentifier
      operator: present
    target: certificate.subjectAltName.uniformResourceIdentifier
    operator: every
    operands:
      - operator: validIA5String
    requirement: must
    message: "URIs in SAN must use IA5String encoding (ASCII only)"
    certType: [leaf]

  # Email addresses must be IA5String (ASCII)
  - id: san-email-valid-ia5string
    reference: RFC5280 4.2.1.6
    when:
      target: certificate.subjectAltName.rfc822Name
      operator: present
    target: certificate.subjectAltName.rfc822Name
    operator: every
    operands:
      - operator: validIA5String
    requirement: must
    message: "Email addresses in SAN must use IA5String encoding (ASCII only)"
    certType: [leaf]

  # IA5-valued GeneralName choices in IAN have the same wire character-set
  # requirement as their SAN counterparts.
  - id: ian-dnsname-valid-ia5string
    reference: RFC5280 4.2.1.7
    when:
      target: certificate.issuerAltName.dNSName
      operator: present
    target: certificate.issuerAltName.dNSName
    operator: every
    operands:
      - operator: validIA5String
    requirement: must
    message: "DNS names in IAN must use IA5String encoding (ASCII only)"

  - id: ian-uri-valid-ia5string
    reference: RFC5280 4.2.1.7
    when:
      target: certificate.issuerAltName.uniformResourceIdentifier
      operator: present
    target: certificate.issuerAltName.uniformResourceIdentifier
    operator: every
    operands:
      - operator: validIA5String
    requirement: must
    message: "URIs in IAN must use IA5String encoding (ASCII only)"

  - id: ian-email-valid-ia5string
    reference: RFC5280 4.2.1.7
    when:
      target: certificate.issuerAltName.rfc822Name
      operator: present
    target: certificate.issuerAltName.rfc822Name
    operator: every
    operands:
      - operator: validIA5String
    requirement: must
    message: "Email addresses in IAN must use IA5String encoding (ASCII only)"
