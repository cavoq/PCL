      operator: present
    target: certificate
    operator: notRevoked
    requirement: must

  - id: crl-aki-not-critical
    reference: RFC5280 5.2
    when:
      target: crl.extensions.2.5.29.35
      operator: present
    target: crl.extensions.2.5.29.35.critical
    operator: eq
    operands: [false]
    requirement: must

  - id: crl-aki-well-formed
    reference: RFC5280 5.2.1
    when:
      target: crl.extensions.2.5.29.35
      operator: present
    target: crl.extensions.2.5.29.35.malformed
    operator: absent
    requirement: must

  - id: crl-authority-key-identifier-present
    reference: RFC5280 5.2.1
    when:
      target: crl
      operator: present
    target: crl.authorityKeyIdentifier
    operator: present
    requirement: must

  - id: crl-number-not-critical
    reference: RFC5280 5.2
    when:
      target: crl.extensions.2.5.29.20
      operator: present
    target: crl.extensions.2.5.29.20.critical
    operator: eq
    operands: [false]
    requirement: must

  - id: crl-number-well-formed
    reference: RFC5280 5.2.3
    when:
      target: crl.extensions.2.5.29.20
      operator: present
    target: crl.extensions.2.5.29.20.malformed
    operator: absent
    requirement: must

  - id: crl-number-present
    reference: RFC5280 5.2.3
    when:
      target: crl
      operator: present
    target: crl.crlNumber
    operator: present
    requirement: must

  - id: crl-delta-indicator-critical
    reference: RFC5280 5.2
    when:
      target: crl.extensions.2.5.29.27
      operator: present
    target: crl.extensions.2.5.29.27.critical
    operator: eq
    operands: [true]
    requirement: must

  - id: crl-delta-indicator-well-formed
    reference: RFC5280 5.2.4
    when:
      target: crl.extensions.2.5.29.27
      operator: present
    target: crl.extensions.2.5.29.27.malformed
    operator: absent
    requirement: must

  - id: crl-idp-critical
    reference: RFC5280 5.2
    when:
      target: crl.extensions.2.5.29.28
      operator: present
    target: crl.extensions.2.5.29.28.critical
    operator: eq
    operands: [true]
    requirement: must

  - id: crl-idp-well-formed
    reference: RFC5280 5.2.5
    when:
      target: crl.extensions.2.5.29.28
      operator: present
    target: crl.extensions.2.5.29.28.malformed
    operator: absent
    requirement: must

  - id: crl-idp-excludes-attribute-certificates
    reference: RFC5280 5.2.5
    when:
      target: crl.extensions.2.5.29.28
      operator: present
    target: crl.issuingDistributionPoint.onlyContainsAttributeCerts
    operator: eq
    operands: [false]
    requirement: must

  - id: crl-freshest-well-formed
    reference: RFC5280 5.2.6
    when:
      target: crl.extensions.2.5.29.46
      operator: present
    target: crl.extensions.2.5.29.46.malformed
    operator: absent
    requirement: must

  - id: crl-freshest-not-critical
    reference: RFC5280 5.2.6
    when:
      target: crl.extensions.2.5.29.46
      operator: present
    target: crl.extensions.2.5.29.46.critical
    operator: eq
    operands: [false]
    requirement: must

  - id: crl-delta-omits-freshest
    reference: RFC5280 5.2.6
    when:
