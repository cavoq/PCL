# PKITS runs whose PCL outcome differs from the PKITS expectation, with the
# reason. TestPKITS fails when a listed run starts to conform, so this list
# only shrinks.
- run: "4.1.5#1"
  reason: >-
    zcrypto cannot parse a DSA subjectPublicKeyInfo whose parameters are
    inherited from the issuer (asn1: sequence truncated), so the CA
    certificate cannot be loaded.
- run: "4.14.4#1"
  reason: >-
    zcrypto cannot parse a CRL distribution point using
    nameRelativeToCRLIssuer (asn1: sequence tag mismatch), so the end entity
    certificate cannot be loaded; PCL's own decoder supports the form.
- run: "4.14.5#1"
  reason: >-
    zcrypto cannot parse a CRL distribution point using
    nameRelativeToCRLIssuer (asn1: sequence tag mismatch), so the end entity
    certificate cannot be loaded; PCL's own decoder supports the form.
- run: "4.14.29#1"
  reason: >-
    zcrypto cannot parse a CRL distribution point whose cRLIssuer uses this
    form (asn1: sequence tag mismatch), so the end entity certificate cannot
    be loaded; PCL's own decoder supports the form.
