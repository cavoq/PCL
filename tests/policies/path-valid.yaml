# yaml-language-server: $schema=../../schemas/policy.schema.json
#
# The path engine's aggregate RFC 5280 Section 6/7 decision. It is attached
# to the evaluated target when explicit trust anchors are supplied; the PKITS
# and x509-limbo harnesses and the path policy suite share this policy.
id: path-valid
version: "1.0"
appliesTo: [cert]

rules:
  - id: certification-path-valid
    reference: RFC5280 6, 7
    when:
      target: certificate.pathValidation
      operator: present
    target: certificate
    operator: pathValid
    severity: error
