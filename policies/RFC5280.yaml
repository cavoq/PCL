# yaml-language-server: $schema=https://raw.githubusercontent.com/cavoq/PCL/master/schemas/policy.schema.json
id: rfc5280
version: "2.2"
metadata:
  title: X.509 certificate, CRL, and certification-path checks
  standard: RFC 5280
  edition: "2008"
  source: https://www.rfc-editor.org/rfc/rfc5280
  description: Profile rules and conditional explicit-trust path validation; see RFC5280-COVERAGE.md for scope.
  inputs: [certificate, issuers, trustAnchors, crl, ocsp, purpose, validationTime]

rules:

  # -------------------------------------------------
  # Certificate structure (Section 4.1)
  # -------------------------------------------------

  - id: tbs-certificate-metadata-well-formed
    reference: RFC5280 4.1.2
    target: certificate.tbsCertificate.malformed
    operator: absent
    certType: [leaf, intermediate, root]
    requirement: must

  # Version MUST be 3 when extensions are present
  - id: version-v3-when-extensions
    reference: RFC5280 4.1.2.1
    when:
      target: certificate.extensions
      operator: present
    target: certificate.version
    operator: eq
    operands: [3]
    requirement: must

  # Version MUST be v2 or v3 when a UniqueIdentifier is present.
  - id: version-v2-when-unique-id
    reference: RFC5280 4.1.2.1
    when:
      target: certificate.issuerUniqueID
      operator: present
    target: certificate.version
    operator: gte
    operands: [2]
    requirement: must

  - id: version-v2-when-subject-unique-id
    reference: RFC5280 4.1.2.1
    when:
      target: certificate.subjectUniqueID
      operator: present
    target: certificate.version
    operator: gte
    operands: [2]
    requirement: must

  - id: serial-number-present
    reference: RFC5280 4.1.2.2
    target: certificate.serialNumber
    operator: present
    requirement: must

  - id: serial-number-positive
    reference: RFC5280 4.1.2.2
    target: certificate.serialNumber.value
    operator: positive
    requirement: must

  # Serial-number uniqueness is an issuance-database property. It cannot be
  # established from one certification path and is intentionally not claimed
  # by this profile policy.

  - id: serial-number-length
    reference: RFC5280 4.1.2.2
    target: certificate.serialNumber
    operator: maxLength
    operands: [20]
    requirement: must

  - id: signature-algorithm-matches-tbs
    reference: RFC5280 4.1.2.3
    target: certificate
    operator: signatureAlgorithmMatchesTBS
    requirement: must

  - id: signature-valid
    reference: RFC5280 4.1.2.3
    # Trust anchors are trusted as given (RFC 5280 6.1.1); their own issuer
    # is not an input.
    when:
      target: certificate.trustAnchor
      operator: neq
      operands: [true]
    target: certificate
    operator: signatureValid
    requirement: must

  # The dedicated Section 6/7 path engine is activated only when the caller
  # supplies one or more explicit --trust-anchor inputs. Profile-only runs
  # retain their existing behavior and skip this aggregate path decision.
  - id: certification-path-valid
    reference: RFC5280 6, 7
    when:
      target: certificate.pathValidation
      operator: present
    target: certificate
    operator: pathValid
    requirement: must


  # -------------------------------------------------
  # Issuer / Subject (Section 4.1.2.4, 4.1.2.6)
  # -------------------------------------------------

  - id: issuer-name-well-formed
    reference: RFC5280 4.1.2.4
    target: certificate.issuer.malformed
    operator: absent
    certType: [leaf, intermediate, root]
    requirement: must

  - id: subject-name-well-formed
    reference: RFC5280 4.1.2.6
    target: certificate.subject.malformed
    operator: absent
    certType: [leaf, intermediate, root]
    requirement: must

  - id: issuer-not-empty
    reference: RFC5280 4.1.2.4
    target: certificate.issuer
    operator: notEmpty
    requirement: must

  - id: subject-not-empty-for-ca
    reference: RFC5280 4.1.2.6
    target: certificate.subject
    operator: notEmpty
    certType: [root, intermediate]
    requirement: must

  # -------------------------------------------------
  # Validity (Section 4.1.2.5)
  # -------------------------------------------------

  - id: not-expired
    reference: RFC5280 4.1.2.5
    target: certificate.validity.notAfter
    operator: onOrAfter
    requirement: must

  - id: not-yet-valid
    reference: RFC5280 4.1.2.5
    target: certificate.validity.notBefore
    operator: onOrBefore
    requirement: must

  - id: validity-order-correct
    reference: RFC5280 4.1.2.5
    target: certificate
    operator: validityOrderCorrect
    requirement: must


  # -------------------------------------------------
  # Unique Identifiers (Section 4.1.2.8)
  # -------------------------------------------------

  - id: issuer-unique-id-absent
    reference: RFC5280 4.1.2.8
    target: certificate.issuerUniqueID
    operator: absent
    certType: [leaf, intermediate, root]
    requirement: must

  - id: subject-unique-id-absent
    reference: RFC5280 4.1.2.8
    target: certificate.subjectUniqueID
    operator: absent
    certType: [leaf, intermediate, root]
    requirement: must


  # -------------------------------------------------
  # Extensions (Section 4.2)
  # -------------------------------------------------

  - id: no-unknown-critical-extensions
    reference: RFC5280 4.1.2.9, 6
    target: certificate
    operator: noUnknownCriticalExtensions
    requirement: must


  # -------------------------------------------------
  # Authority Key Identifier (Section 4.2.1.1)
  # -------------------------------------------------

  - id: authority-key-identifier-present
    reference: RFC5280 4.2.1.1
    target: certificate.authorityKeyIdentifier
    operator: present
    certType: [leaf, intermediate]
    requirement: must

  - id: aki-not-critical
    reference: RFC5280 4.2.1.1
    when:
      target: certificate.authorityKeyIdentifier
      operator: present
    target: certificate.extensions.authorityKeyIdentifier.critical
    operator: eq
    operands: [false]
    requirement: must

  - id: aki-well-formed
    reference: RFC5280 4.2.1.1
    when:
      target: certificate.extensions.authorityKeyIdentifier
      operator: present
    target: certificate.extensions.authorityKeyIdentifier.malformed
    operator: absent
    requirement: must

  - id: aki-matches-ski
    reference: RFC5280 4.2.1.1, 4.2.1.2
    # Trust anchors are trusted as given (RFC 5280 6.1.1); their own issuer
    # is not an input.
    when:
      target: certificate.trustAnchor
      operator: neq
      operands: [true]
    target: certificate
    operator: akiMatchesSki
    requirement: must


  # -------------------------------------------------
  # Subject Key Identifier (Section 4.2.1.2)
  # -------------------------------------------------

  - id: subject-key-identifier-present
    reference: RFC5280 4.2.1.2
    target: certificate.subjectKeyIdentifier
    operator: present
    certType: [root, intermediate]
    requirement: must

  - id: subject-key-identifier-present-leaf
    reference: RFC5280 4.2.1.2
    target: certificate.subjectKeyIdentifier
    operator: present
    certType: [leaf]
    requirement: should

  - id: ski-not-critical
    reference: RFC5280 4.2.1.2
    when:
      target: certificate.extensions.subjectKeyIdentifier
      operator: present
    target: certificate.extensions.subjectKeyIdentifier.critical
    operator: eq
    operands: [false]
    requirement: must


  # -------------------------------------------------
  # Key Usage (Section 4.2.1.3)
  # -------------------------------------------------

  - id: key-usage-well-formed
    reference: RFC5280 4.2.1.3
    when:
      target: certificate.extensions.keyUsage
      operator: present
    target: certificate.extensions.keyUsage.malformed
    operator: absent
    requirement: must

  - id: key-usage-dependencies-valid
    reference: RFC5280 4.2.1.3
    when:
      target: certificate.extensions.keyUsage
      operator: present
    target: certificate
    operator: keyUsageDependenciesValid
    requirement: must

  - id: key-usage-present
    reference: RFC5280 4.2.1.3
    target: certificate.extensions.keyUsage
    operator: present
    certType: [root, intermediate]
    requirement: must

  - id: key-usage-has-at-least-one-bit
    reference: RFC5280 4.2.1.3
    when:
      target: certificate.extensions.keyUsage
      operator: present
    target: certificate.keyUsage
    operator: positive
    requirement: must

  - id: key-usage-critical-for-ca
    reference: RFC5280 4.2.1.3
    when:
      target: certificate.extensions.keyUsage
      operator: present
    target: certificate.extensions.keyUsage.critical
    operator: eq
    operands: [true]
    certType: [root, intermediate]
    requirement: should

  - id: ca-key-cert-sign
    reference: RFC5280 4.2.1.3
    when:
      target: certificate.extensions.keyUsage
      operator: present
    target: certificate.keyUsage.keyCertSign
    operator: eq
    operands: [true]
    certType: [root, intermediate]
    requirement: must

  - id: leaf-key-usage-valid
    reference: RFC5280 4.2.1.3
    when:
      target: certificate.extensions.keyUsage
      operator: present
    target: certificate.keyUsage.keyCertSign
    operator: eq
    operands: [false]
    certType: [leaf]
    requirement: must


  # -------------------------------------------------
  # Certificate Policies (Section 4.2.1.4)
  # -------------------------------------------------

  - id: certificate-policies-well-formed
    reference: RFC5280 4.2.1.4
    when:
      target: certificate.extensions.certificatePolicies
      operator: present
    target: certificate.extensions.certificatePolicies.malformed
    operator: absent
    requirement: must


  # -------------------------------------------------
  # Policy Mappings (Section 4.2.1.5)
  # -------------------------------------------------

  - id: policy-mappings-well-formed
    reference: RFC5280 4.2.1.5
    when:
      target: certificate.extensions.policyMappings
      operator: present
    target: certificate.extensions.policyMappings.malformed
    operator: absent
    requirement: must

  - id: policy-mappings-dependencies-valid
    reference: RFC5280 4.2.1.5
    when:
      target: certificate.extensions.policyMappings
      operator: present
    target: certificate
    operator: policyMappingsDependenciesValid
    requirement: must

  - id: policy-mappings-issuer-policies-present
    reference: RFC5280 4.2.1.5
    when:
      target: certificate.extensions.policyMappings
      operator: present
    target: certificate
    operator: policyMappingsIssuerPoliciesPresent
    requirement: should

  - id: policy-mappings-critical
    reference: RFC5280 4.2.1.5
    when:
      target: certificate.extensions.2.5.29.33
      operator: present
    target: certificate.extensions.2.5.29.33.critical
    operator: eq
    operands: [true]
    requirement: should


  # -------------------------------------------------
  # Subject Alternative Name (Section 4.2.1.6)
  # -------------------------------------------------

  - id: san-general-names-well-formed
    reference: RFC5280 4.2.1.6
    when:
      target: certificate.subjectAltName
      operator: present
    target: certificate.subjectAltName.malformed
    operator: absent
    requirement: must

  - id: san-required-if-empty-subject
    reference: RFC5280 4.2.1.6
    when:
      target: certificate.subject
      operator: isEmpty
    target: certificate.subjectAltName
    operator: present
    certType: [leaf]
    requirement: must

  - id: san-critical-if-subject-empty
    reference: RFC5280 4.2.1.6
    when:
      target: certificate.subject
      operator: isEmpty
    target: certificate.extensions.subjectAltName.critical
    operator: eq
    operands: [true]
    requirement: must


  # -------------------------------------------------
  # Issuer Alternative Name (Section 4.2.1.7)
  # -------------------------------------------------

  - id: ian-general-names-well-formed
    reference: RFC5280 4.2.1.7
    when:
      target: certificate.issuerAltName
      operator: present
    target: certificate.issuerAltName.malformed
    operator: absent
    requirement: must

  - id: ian-not-critical
    reference: RFC5280 4.2.1.7
    when:
      target: certificate.extensions.2.5.29.18
      operator: present
    target: certificate.extensions.2.5.29.18.critical
    operator: eq
    operands: [false]
    requirement: should


  # -------------------------------------------------
  # Subject Directory Attributes (Section 4.2.1.8)
  # -------------------------------------------------

  - id: subject-directory-attributes-not-critical
    reference: RFC5280 4.2.1.8
    when:
      target: certificate.extensions.2.5.29.9
      operator: present
    target: certificate.extensions.2.5.29.9.critical
    operator: eq
    operands: [false]
    requirement: must


  # -------------------------------------------------
  # Basic Constraints (Section 4.2.1.9)
  # -------------------------------------------------

  - id: basic-constraints-well-formed
    reference: RFC5280 4.2.1.9
    when:
      target: certificate.extensions.basicConstraints
      operator: present
    target: certificate.extensions.basicConstraints.malformed
    operator: absent
    requirement: must

  - id: basic-constraints-dependencies-valid
    reference: RFC5280 4.2.1.9
    when:
      target: certificate.extensions.basicConstraints
      operator: present
    target: certificate
    operator: basicConstraintsDependenciesValid
    requirement: must

  - id: basic-constraints-present
    reference: RFC5280 4.2.1.9
    target: certificate.basicConstraints
    operator: present
    certType: [root, intermediate]
    requirement: must

  - id: basic-constraints-critical-for-ca
    reference: RFC5280 4.2.1.9
    when:
      target: certificate.basicConstraints.cA
      operator: eq
      operands: [true]
    target: certificate.extensions.basicConstraints.critical
    operator: eq
    operands: [true]
    requirement: must

  - id: ca-basic-constraints
    reference: RFC5280 4.2.1.9
    target: certificate.basicConstraints.cA
    operator: eq
    operands: [true]
    certType: [root, intermediate]
    requirement: must

  - id: leaf-not-ca
    reference: RFC5280 4.2.1.9
    target: certificate.basicConstraints.cA
    operator: neq
    operands: [true]
    certType: [leaf]
    requirement: must

  - id: ca-path-len-valid
    reference: RFC5280 4.2.1.9
    target: certificate
    operator: pathLenValid
    certType: [root, intermediate]
    requirement: must


  # -------------------------------------------------
  # Name Constraints (Section 4.2.1.10)
  # -------------------------------------------------

  - id: name-constraints-well-formed
    reference: RFC5280 4.2.1.10
    when:
      target: certificate.extensions.nameConstraints
      operator: present
    target: certificate.extensions.nameConstraints.malformed
    operator: absent
    requirement: must

  - id: name-constraints-dependencies-valid
    reference: RFC5280 4.2.1.10
    when:
      target: certificate.extensions.nameConstraints
      operator: present
    target: certificate
    operator: nameConstraintsDependenciesValid
    requirement: must

  - id: name-constraints-distances-valid
    reference: RFC5280 4.2.1.10
    when:
      target: certificate.extensions.nameConstraints
      operator: present
    target: certificate
    operator: nameConstraintsDistancesValid
    requirement: must

  - id: name-constraints-critical
    reference: RFC5280 4.2.1.10
    when:
      target: certificate.nameConstraints
      operator: present
    target: certificate.extensions.nameConstraints.critical
    operator: eq
    operands: [true]
    requirement: must

  - id: name-constraints-valid
    reference: RFC5280 4.2.1.10
    target: certificate
    operator: nameConstraintsValid
    requirement: must


  # -------------------------------------------------
  # Certificate Policies (Section 4.2.1.4)
  # -------------------------------------------------

  # Policy validation is use-case dependent - uncomment and specify required policies:
  # - id: certificate-policy-valid
  #   target: certificate
  #   operator: certificatePolicyValid
  #   operands: ["2.5.29.32.0"]  # anyPolicy, or specific policy OIDs
  #   severity: error


  # -------------------------------------------------
  # Policy Constraints (Section 4.2.1.11)
  # -------------------------------------------------

  - id: policy-constraints-well-formed
    reference: RFC5280 4.2.1.11
    when:
      target: certificate.extensions.policyConstraints
      operator: present
    target: certificate.extensions.policyConstraints.malformed
    operator: absent
    requirement: must

  - id: policy-constraints-dependencies-valid
    reference: RFC5280 4.2.1.11
    when:
      target: certificate.extensions.policyConstraints
      operator: present
    target: certificate
    operator: policyConstraintsDependenciesValid
    requirement: must

  - id: policy-constraints-critical
    reference: RFC5280 4.2.1.11
    when:
      target: certificate.extensions.2.5.29.36
      operator: present
    target: certificate.extensions.2.5.29.36.critical
    operator: eq
    operands: [true]
    requirement: must


  # -------------------------------------------------
  # Extended Key Usage (Section 4.2.1.12)
  # -------------------------------------------------

  - id: extended-key-usage-well-formed
    reference: RFC5280 4.2.1.12
    when:
      target: certificate.extensions.extKeyUsage
      operator: present
    target: certificate.extensions.extKeyUsage.malformed
    operator: absent
    requirement: must

  - id: extended-key-usage-allows-application-purpose
    reference: RFC5280 4.2.1.12
    when:
      target: certificate.applicationPurpose
      operator: present
    target: certificate
    operator: applicationPurposeValid
    requirement: must

  - id: any-extended-key-usage-not-critical
    reference: RFC5280 4.2.1.12
    when:
      target: certificate.extensions.extKeyUsage
      operator: present
    target: certificate
    operator: anyExtendedKeyUsageNotCritical
    requirement: should


  # -------------------------------------------------
  # CRL Distribution Points (Section 4.2.1.13)
  # -------------------------------------------------

  - id: crl-distribution-points-well-formed
    reference: RFC5280 4.2.1.13
    when:
      target: certificate.extensions.cRLDistributionPoints
      operator: present
    target: certificate.extensions.cRLDistributionPoints.malformed
    operator: absent
    requirement: must

  - id: crl-distribution-points-dependencies-valid
    reference: RFC5280 4.2.1.13
    when:
      target: certificate.extensions.cRLDistributionPoints
      operator: present
    target: certificate
    operator: crlDistributionPointsDependenciesValid
    requirement: must

  - id: crl-distribution-points-not-critical
    reference: RFC5280 4.2.1.13
    when:
      target: certificate.extensions.cRLDistributionPoints
      operator: present
    target: certificate.extensions.cRLDistributionPoints.critical
    operator: eq
    operands: [false]
    requirement: should


  # -------------------------------------------------
  # Inhibit anyPolicy (Section 4.2.1.14)
  # -------------------------------------------------

  - id: inhibit-any-policy-well-formed
    reference: RFC5280 4.2.1.14
    when:
      target: certificate.extensions.inhibitAnyPolicy
      operator: present
    target: certificate.extensions.inhibitAnyPolicy.malformed
    operator: absent
    requirement: must

  - id: inhibit-any-policy-dependencies-valid
    reference: RFC5280 4.2.1.14
    when:
      target: certificate.extensions.inhibitAnyPolicy
      operator: present
    target: certificate
    operator: inhibitAnyPolicyDependenciesValid
    requirement: must

  - id: inhibit-any-policy-critical
    reference: RFC5280 4.2.1.14
    when:
      target: certificate.extensions.2.5.29.54
      operator: present
    target: certificate.extensions.2.5.29.54.critical
    operator: eq
    operands: [true]
    requirement: must


  # -------------------------------------------------
  # Freshest CRL (Section 4.2.1.15)
  # -------------------------------------------------

  - id: freshest-crl-well-formed
    reference: RFC5280 4.2.1.15
    when:
      target: certificate.extensions.2.5.29.46
      operator: present
    target: certificate.extensions.2.5.29.46.malformed
    operator: absent
    requirement: must

  - id: freshest-crl-not-critical
    reference: RFC5280 4.2.1.15
    when:
      target: certificate.extensions.2.5.29.46
      operator: present
    target: certificate.extensions.2.5.29.46.critical
    operator: eq
    operands: [false]
    requirement: must


  # -------------------------------------------------
  # Authority Information Access (Section 4.2.2.1)
  # -------------------------------------------------

  - id: aia-not-critical
    reference: RFC5280 4.2.2.1
    when:
      target: certificate.extensions.1.3.6.1.5.5.7.1.1
      operator: present
    target: certificate.extensions.1.3.6.1.5.5.7.1.1.critical
    operator: eq
    operands: [false]
    requirement: must

  # CA Issuers MUST be DER or BER encoded (PEM is not RFC compliant)
  # RFC 5280 4.2.2.1: "If the information is available via HTTP or FTP, then the
  # URI MUST point to either a single DER-encoded certificate or a
  # DER-encoded PKCS#7 certificate bundle."
  - id: ca-issuers-der-format
    reference: RFC5280 4.2.2.1
    when:
      target: certificate.downloadFormat
      operator: present
    target: certificate.downloadFormat
    operator: neq
    operands: ["PEM"]
    requirement: must


  # -------------------------------------------------
  # Subject Information Access (Section 4.2.2.2)
  # -------------------------------------------------

  - id: sia-not-critical
    reference: RFC5280 4.2.2.2
    when:
      target: certificate.extensions.1.3.6.1.5.5.7.1.11
      operator: present
    target: certificate.extensions.1.3.6.1.5.5.7.1.11.critical
    operator: eq
    operands: [false]
    requirement: must


  # -------------------------------------------------
  # CRL Profile (Section 5)
  # -------------------------------------------------

  - id: crl-issuer-name-well-formed
    reference: RFC5280 5.1.2.3
    when:
      target: crl
      operator: present
    target: crl.issuer.malformed
    operator: absent
    requirement: must

  - id: crl-valid
    reference: RFC5280 5.1
    when:
      target: crl
      operator: present
    target: crl
    operator: crlValid
    requirement: must

  - id: crl-next-update-present
    reference: RFC5280 5.1.2.5
    when:
      target: crl
      operator: present
    target: crl.nextUpdate
    operator: present
    requirement: must

  # TBSCertList time encodings (5.1.2.4-5.1.2.6): UTCTime through 2049,
  # GeneralizedTime from 2050, with seconds, "Z" and no fraction. The tag
  # rules pin the length, so one pattern checks the format. The CRL parser
  # rejects versions other than v2 (5.1.2.1) and fractional seconds.
  - id: crl-this-update-utctime-through-2049
    reference: RFC5280 5.1.2.4
    when:
      target: crl.thisUpdate
      operator: before
      operands: ["2050-01-01T00:00:00Z"]
    target: crl.thisUpdate.encoding
    operator: eq
    operands: [23]
    requirement: must

  - id: crl-this-update-generalizedtime-from-2050
    reference: RFC5280 5.1.2.4
    when:
      target: crl.thisUpdate
      operator: onOrAfter
      operands: ["2050-01-01T00:00:00Z"]
    target: crl.thisUpdate.encoding
    operator: eq
    operands: [24]
    requirement: must

  - id: crl-this-update-time-format
    reference: RFC5280 5.1.2.4, 4.1.2.5.1, 4.1.2.5.2
    when:
      target: crl.thisUpdate
      operator: present
    target: crl.thisUpdate.rawValue
    operator: regex
    operands: ["^([0-9]{12}|[0-9]{14})Z$"]
    requirement: must
    message: "thisUpdate must be YYMMDDHHMMSSZ (UTCTime) or YYYYMMDDHHMMSSZ (GeneralizedTime)"

  - id: crl-next-update-utctime-through-2049
    reference: RFC5280 5.1.2.5
    when:
      target: crl.nextUpdate
      operator: before
      operands: ["2050-01-01T00:00:00Z"]
    target: crl.nextUpdate.encoding
    operator: eq
    operands: [23]
    requirement: must

  - id: crl-next-update-generalizedtime-from-2050
    reference: RFC5280 5.1.2.5
    when:
      target: crl.nextUpdate
      operator: onOrAfter
      operands: ["2050-01-01T00:00:00Z"]
    target: crl.nextUpdate.encoding
    operator: eq
    operands: [24]
    requirement: must

  - id: crl-next-update-time-format
    reference: RFC5280 5.1.2.5, 4.1.2.5.1, 4.1.2.5.2
    when:
      target: crl.nextUpdate
      operator: present
    target: crl.nextUpdate.rawValue
    operator: regex
    operands: ["^([0-9]{12}|[0-9]{14})Z$"]
    requirement: must
    message: "nextUpdate must be YYMMDDHHMMSSZ (UTCTime) or YYYYMMDDHHMMSSZ (GeneralizedTime)"

  - id: crl-revocation-date-utctime-through-2049
    reference: RFC5280 5.1.2.6, 5.1.2.4
    when:
      target: crl.revokedCertificates
      operator: present
    target: crl.revokedCertificates
    operator: every
    operands:
      - operator: anyOf
        operands:
          - {path: revocationDate, operator: onOrAfter, operands: ["2050-01-01T00:00:00Z"]}
          - {path: revocationDate.encoding, operator: eq, operands: [23]}
    requirement: must
    message: "revocationDate through 2049 must be UTCTime"

  - id: crl-revocation-date-generalizedtime-from-2050
    reference: RFC5280 5.1.2.6, 5.1.2.4
    when:
      target: crl.revokedCertificates
      operator: present
    target: crl.revokedCertificates
    operator: every
    operands:
      - operator: anyOf
        operands:
          - {path: revocationDate, operator: before, operands: ["2050-01-01T00:00:00Z"]}
          - {path: revocationDate.encoding, operator: eq, operands: [24]}
    requirement: must
    message: "revocationDate from 2050 must be GeneralizedTime"

  - id: crl-revocation-date-time-format
    reference: RFC5280 5.1.2.6, 4.1.2.5.1, 4.1.2.5.2
    when:
      target: crl.revokedCertificates
      operator: present
    target: crl.revokedCertificates
    operator: every
    operands:
      - {path: revocationDate.rawValue, operator: regex, operands: ["^([0-9]{12}|[0-9]{14})Z$"]}
    requirement: must
    message: "revocationDate must be YYMMDDHHMMSSZ (UTCTime) or YYYYMMDDHHMMSSZ (GeneralizedTime)"

  - id: crl-signed-by
    reference: RFC5280 5.1
    when:
      target: crl
      operator: present
    target: crl
    operator: crlSignedBy
    requirement: must

  - id: crl-signature-algorithm-matches-tbs
    reference: RFC5280 5.1.1.2, 5.1.2.2
    when:
      target: crl
