# Example policy test suite: run with `pcl test tests/policy-suites`.
policy:
  - ../policies/eku.yaml
  - ../policies/name-constraints.yaml
time: 2026-10-01

tests:
  - name: server leaf satisfies the EKU profile
    cert: ../certs/leaf.pem
    issuers: [../certs/intermediate.pem, ../certs/root.pem]
    expect:
      - input: leaf
        policy: integration-eku
        verdict: pass
        rules:
          leaf-has-server-auth: pass
          leaf-no-client-auth: pass
          server-auth-valid: pass
      - input: root
        policy: integration-eku
        rules:
          leaf-has-server-auth: skip

  - name: leaf inside the permitted subtree
    cert: ../certs/nc-good-leaf.pem
    issuers: [../certs/nc-intermediate.pem, ../certs/nc-root.pem]
    expect:
      - input: leaf
        policy: integration-name-constraints
        rules:
          name-constraints-valid: pass

  - name: leaf outside the permitted subtree
    cert: ../certs/nc-bad-leaf.pem
    issuers: [../certs/nc-intermediate.pem, ../certs/nc-root.pem]
    expect:
      - input: leaf
        policy: integration-name-constraints
        verdict: fail
        rules:
          name-constraints-valid: fail

  - name: unreadable certificate is reported
    cert: ../certs/missing.pem
    error: failed to load certificates
