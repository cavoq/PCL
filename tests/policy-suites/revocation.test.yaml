policy: ../policies/ocsp-good.yaml
time: 2026-10-01

tests:
  - name: good OCSP response
    cert: ../certs/ocsp-leaf.pem
    issuers: [../certs/ocsp-intermediate.pem, ../certs/ocsp-root.pem]
    ocsp: ../ocsps/good-leaf.ocsp
    expect:
      - input: leaf
        verdict: pass
        rules:
          ocsp-response-valid: pass
          ocsp-status-good: pass

  - name: revoked OCSP response
    cert: ../certs/ocsp-leaf.pem
    issuers: [../certs/ocsp-intermediate.pem, ../certs/ocsp-root.pem]
    ocsp: ../ocsps/revoked-leaf.ocsp
    expect:
      - input: leaf
        verdict: fail
        rules:
          ocsp-status-good: fail
