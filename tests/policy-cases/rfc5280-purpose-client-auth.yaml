name: rfc5280-purpose-client-auth
policy: ../policies/RFC5280.yaml
rules:
  - extended-key-usage-allows-application-purpose
certs: certs/leaf.pem
issuers:
  - certs/intermediate.pem
  - certs/root.pem
application_purpose: clientAuth
expected:
  leaf:
    pass: 0
    fail: 1
    skip: 0
  intermediate:
    pass: 1
    fail: 0
    skip: 0
  root:
    pass: 1
    fail: 0
    skip: 0
