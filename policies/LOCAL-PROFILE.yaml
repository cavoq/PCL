# yaml-language-server: $schema=https://raw.githubusercontent.com/cavoq/PCL/master/schemas/policy.schema.json
id: local-profile
version: 1.0
metadata:
  title: Supplemental local certificate profile
  description: Local and WebPKI checks; not counted as RFC 5280 coverage.
  inputs: [certificate, issuers, psl]

rules:
  # Supplemental X.520/local profile: businessCategory max 128 characters
  - id: subject-business-category-max-length
    reference: LOCAL-X520-PROFILE
    when:
      target: certificate.subject.businessCategory
      operator: present
    target: certificate.subject.businessCategory
    operator: every
    operands:
      - path: value
        operator: maxLength
        operands: [128]
    requirement: must
    message: "businessCategory must not exceed 128 characters"
    certType: [leaf, intermediate]

  # Wildcard semantics are application-specific in RFC 5280.
  - id: ian-no-wildcard-dns
    reference: LOCAL-PROFILE
    when:
      target: certificate.issuerAltName.dNSName
      operator: present
    target: certificate.issuerAltName.dNSName
    operator: every
    operands:
      - operator: notRegex
        operands: ["^\\*"]
    requirement: should
    message: "Local profile discourages wildcard IAN dNSName values"
    certType: [leaf, intermediate]

  # IAN URI must use HTTP or HTTPS scheme.
  - id: ian-uri-http-scheme
    reference: LOCAL-WEBPKI-PROFILE
    when:
      target: certificate.issuerAltName.uniformResourceIdentifier
      operator: present
    target: certificate.issuerAltName.uniformResourceIdentifier
    operator: every
    operands:
      - operator: regex
        operands: ["^https?://"]
    requirement: should
    message: "IAN URI should use HTTP or HTTPS scheme"
    certType: [leaf, intermediate]

  # IAN dNSName should not contain internal names.
  - id: ian-no-internal-names
    reference: LOCAL-WEBPKI-PROFILE
    when:
      target: certificate.issuerAltName.dNSName
      operator: present
    target: certificate.issuerAltName.dNSName
    operator: every
    operands:
      - operator: tldRegistered
    requirement: should
    message: "IAN dNSName should not contain internal names with unregistered TLDs"
    certType: [leaf, intermediate]

  # SAN uniformResourceIdentifier must use HTTP or HTTPS.
  - id: san-uri-http-scheme
    reference: LOCAL-WEBPKI-PROFILE
    when:
      target: certificate.subjectAltName.uniformResourceIdentifier
      operator: present
    target: certificate.subjectAltName.uniformResourceIdentifier
    operator: every
    operands:
      - operator: regex
        operands: ["^https?://"]
    requirement: should
    message: "SAN URI should use HTTP or HTTPS scheme"
    certType: [leaf]

  # SAN URI max length (reasonable local limit).
  - id: san-uri-max-length
    reference: LOCAL-PROFILE
    when:
      target: certificate.subjectAltName.uniformResourceIdentifier
      operator: present
    target: certificate.subjectAltName.uniformResourceIdentifier
    operator: every
    operands:
      - operator: maxLength
        operands: [1024]
    requirement: should
    message: "SAN URI should not exceed 1024 characters"
    certType: [leaf]

  # The legacy subject emailAddress has no syntax requirement in RFC 5280;
  # new certificates carry mailboxes in rfc822Name (4.1.2.6).
  - id: subject-email-format
    reference: LOCAL-PROFILE
    when:
      target: certificate.subject.emailAddress
      operator: present
    target: certificate.subject.emailAddress
    operator: every
    operands:
      - path: value
        operator: regex
        operands: ["^[^@]+@[^@]+$"]
    requirement: should
    message: "subject emailAddress should be valid RFC 822 format"
    certType: [leaf, intermediate]

  # RFC 5280 does not restrict URI fragments.
  - id: san-uri-no-fragment
    reference: LOCAL-PROFILE
    when:
      target: certificate.subjectAltName.uniformResourceIdentifier
      operator: present
    target: certificate.subjectAltName.uniformResourceIdentifier
    operator: every
    operands:
      - operator: notRegex
        operands: ["#"]
    requirement: should
    message: "SAN URI should not contain fragment identifier"
    certType: [leaf]
