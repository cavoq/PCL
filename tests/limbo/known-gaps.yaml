# x509-limbo testcases whose PCL outcome differs from the limbo expectation,
# grouped by cause. The list may only shrink: TestLimbo fails when a listed
# testcase starts to conform, and when an unlisted one does not. A testcase is
# listed once, under the cause that keeps it from conforming longest.

- reason: >-
    DNS name syntax (RFC 5280 4.2.1.6 and 4.2.1.10, preferred name syntax) is
    not validated, so a malformed dNSName in a subjectAltName or a name
    constraint is accepted.
  cases:
    - rfc5280::nc::invalid-dnsname-leading-period
    - rfc5280::nc::nc-permits-invalid-dns-san
    - rfc5280::san::underscore-dns

- reason: >-
    A wildcard dNSName in the subjectAltName is checked against excluded
    subtrees as a literal name, so `*.example.com` passes an excluded
    `bar.example.com` that the wildcard covers.
  cases:
    - rfc5280::nc::nc-forbids-dnsname-wildcard-san
    - cve::cve-2025-61727

- reason: >-
    Name constraint processing has no work limit; limbo expects the quadratic
    2048 x 2048 constraint checks to be rejected as a denial of service.
  cases:
    - pathological::nc-dos-1
    - pathological::nc-dos-2

- reason: >-
    Path construction ranks candidate paths structurally and validates only
    the best one. When that path fails validation (name constraints, key
    usage), a valid alternative path is not tried (RFC 4158 backtracking).
  cases:
    - bettertls::pathbuilding::tc50
    - bettertls::pathbuilding::tc52
    - bettertls::pathbuilding::tc53
    - bettertls::pathbuilding::tc56
    - bettertls::pathbuilding::tc58
    - bettertls::pathbuilding::tc59

- reason: >-
    A trust anchor that is not self-signed is linted as an intermediate, and
    signature-valid fails because the anchor's own issuer is not supplied.
    RFC 5280 6.1 takes trust anchor information as given.
  cases:
    - rfc5280::root-and-intermediate-swapped
    - cve::cve-2024-0567

- reason: >-
    RFC5280.yaml lints every certificate, trust anchors included, against
    issuance requirements that limbo does not treat as path validation
    failures: keyUsage present in a CA (4.2.1.3), nameConstraints critical
    (4.2.1.10, which CA/B Forum relaxes) and a positive serial number
    (4.1.2.2).
  cases:
    - crl::issuer-no-keyusage-extension
    - webpki::nc::permitted-dns-match-noncritical
    - online::fastly.com

- reason: >-
    A critical nameConstraints extension with an otherName subtree is
    rejected as unprocessable even though no otherName appears on the path;
    RFC 5280 4.2.1.10 only requires constraints on name forms that appear.
  cases:
    - rfc5280::nc::nc-forbids-othername-noop

- reason: >-
    Validity is compared at the instant of the validation time; limbo expects
    comparison at the one-second granularity of the encoded notAfter and
    itself calls the case ambiguous.
  cases:
    - rfc5280::validity::notafter-fractional

- reason: >-
    ML-DSA (RFC 9881) keys and signatures are not supported by the
    certificate parser.
  cases:
    - rfc9881::ml-dsa-44
    - rfc9881::ml-dsa-65
    - rfc9881::ml-dsa-87

- reason: >-
    BetterTLS rejects an intermediate signed with SHA-1, a CA/B Forum
    requirement that RFC 5280 does not make.
  cases:
    - bettertls::pathbuilding::tc8
    - bettertls::pathbuilding::tc15
    - bettertls::pathbuilding::tc41
    - bettertls::pathbuilding::tc47
    - bettertls::pathbuilding::tc74
    - bettertls::pathbuilding::tc80

- reason: >-
    BetterTLS rejects an intermediate whose extendedKeyUsage does not include
    serverAuth (EKU chaining); RFC 5280 checks the application purpose on the
    end entity only.
  cases:
    - bettertls::pathbuilding::tc5
    - bettertls::pathbuilding::tc12
    - bettertls::pathbuilding::tc38
    - bettertls::pathbuilding::tc44
    - bettertls::pathbuilding::tc71
    - bettertls::pathbuilding::tc77

- reason: >-
    CA/B Forum forbids a CA certificate in end-entity position (7.1.2.7);
    RFC 5280 allows it.
  cases:
    - webpki::ca-as-leaf

- reason: >-
    CA/B Forum Baseline Requirements checks that RFC 5280 does not make and
    RFC5280.yaml does not lint: key types and sizes (6.1.5), subject common
    name encoding and SAN consistency (7.1.4.3), end-entity and root EKU
    (7.1.2.7.10, 7.1.2.1.2), root authorityKeyIdentifier fields (7.1.2.1.3),
    critical subjectAltName with a non-empty subject, public-suffix
    wildcards (3.2.2.6) and duplicate CRL serial numbers.
  cases:
    - crl::structure::crl-duplicate-revoked-serial
    - webpki::aki::root-with-aki-missing-keyidentifier
    - webpki::aki::root-with-aki-authoritycertissuer
    - webpki::aki::root-with-aki-authoritycertserialnumber
    - webpki::aki::root-with-aki-all-fields
    - webpki::aki::root-with-aki-ski-mismatch
    - webpki::cn::ipv4-hex-mismatch
    - webpki::cn::ipv4-leading-zeros-mismatch
    - webpki::cn::ipv6-uppercase-mismatch
    - webpki::cn::ipv6-uncompressed-mismatch
    - webpki::cn::ipv6-non-rfc5952-mismatch
    - webpki::cn::punycode-not-in-san
    - webpki::cn::utf8-vs-punycode-mismatch
    - webpki::cn::not-in-san
    - webpki::cn::case-mismatch
    - webpki::eku::ee-anyeku
    - webpki::eku::ee-critical-eku
    - webpki::eku::ee-without-eku
    - webpki::eku::root-has-eku
    - webpki::san::public-suffix-wildcard-san
    - webpki::san::public-suffix-multi-label-wildcard-san
    - webpki::san::public-suffix-private-namespace-wildcard-san
    - webpki::san::san-critical-with-nonempty-subject
    - webpki::forbidden-dsa-root
    - webpki::forbidden-dsa-leaf
    - webpki::forbidden-weak-rsa-key-in-root
    - webpki::forbidden-weak-rsa-in-leaf
    - webpki::forbidden-rsa-not-divisible-by-8-in-root
    - webpki::forbidden-rsa-key-not-divisible-by-8-in-leaf
