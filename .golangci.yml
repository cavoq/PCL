version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - gosec
    - prealloc
    - gocritic
    - gocognit
    - dupl
    - unparam

  settings:
    gocognit:
      min-complexity: 30

    dupl:
      threshold: 100

    errcheck:
      check-type-assertions: true
      check-blank: false

    govet:
      disable:
        - fieldalignment

    misspell:
      locale: US

    gosec:
      excludes:
        - G104  # Errors unhandled (deferred close)
        - G107  # URL from variable — intentional in fetchers
        - G115  # Integer overflow in byte conversions — ASN.1 encoding
        - G301  # Dir permissions 0750+ — acceptable for public data dirs
        - G304  # File path via variable — intentional throughout
        - G306  # File permissions — 0644 is intentional for cert/policy files

    staticcheck:
      checks:
        - all
        - -SA1019

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - unparam
          - errcheck
          - prealloc
          - gocognit
          - dupl

      # Known complexity debt. Strict DER decoders and revocation assessment
      # are refactored separately with golden fixtures; certificatePolicyValid
      # needs an RFC 5280 6.1 rework rather than a restructuring.
      - linters: [gocognit]
        path: internal/crl/(assessment|entries)\.go
        text: "func `\\(\\*Catalog\\)\\.assessCertificate`|func `prepareEntryIndex`"
      - linters: [gocognit]
        path: internal/crl/zcrypto/extensions\.go
        text: "func `decode(AuthorityKeyIdentifier|IssuingDistributionPoint)Extension`"
      - linters: [gocognit]
        path: internal/x509ext/general_names\.go
        text: "func `validateGeneralName`"
      - linters: [gocognit]
        path: internal/operator/policy\.go
        text: "func `\\(CertificatePolicyValid\\)\\.Evaluate`"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
