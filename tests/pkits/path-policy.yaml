# yaml-language-server: $schema=../../schemas/policy.schema.json
#
# Certification path checks used to run NIST PKITS through PCL. A PKITS path
# is valid when no error rule fails for any certificate of the chain. Policy
# processing and its four RFC 5280 initial inputs are added per run by the
# test harness.
id: pkits-path
version: "1.0"
appliesTo: [cert]

rules:
  - id: signature-valid
    reference: RFC5280 6.1.3 (a)(1)
    target: certificate
    operator: signatureValid
    severity: error

  - id: issuer-name-chains
    reference: RFC5280 6.1.3 (a)(4)
    target: certificate
    operator: issuedBy
    severity: error

  - id: not-expired
    reference: RFC5280 6.1.3 (a)(2)
    target: certificate.validity.notAfter
    operator: onOrAfter
    severity: error

  - id: not-yet-valid
    reference: RFC5280 6.1.3 (a)(2)
    target: certificate.validity.notBefore
    operator: onOrBefore
    severity: error

  - id: not-revoked
    reference: RFC5280 6.1.3 (a)(3), 6.3
    target: certificate.revocation.status
    operator: eq
    operands: [good]
    certType: [leaf, intermediate, ocspSigning]
    severity: error

  - id: path-length
    reference: RFC5280 6.1.4 (l)(m)
    target: certificate
    operator: pathLenValid
    severity: error

  - id: name-constraints
    reference: RFC5280 6.1.3 (b)(c), 6.1.4 (g)
    target: certificate
    operator: nameConstraintsValid
    severity: error

  - id: no-unknown-critical-extensions
    reference: RFC5280 6.1.4 (o), 6.1.5 (f)
    target: certificate
    operator: noUnknownCriticalExtensions
    severity: error
