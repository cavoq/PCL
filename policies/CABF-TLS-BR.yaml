  # -------------------------------------------------
  # Subscriber certificate validity period (6.3.2)
  # The Validity Period includes notAfter (inclusive); limits apply by
  # issuance date, for which notBefore stands in.
  # -------------------------------------------------
  - id: br-subscriber-validity-max-398-days
    reference: CABF-BR 6.3.2
    target: certificate.validity
    operator: dateDiff
    operands:
      - {start: notBefore, end: notAfter, maxDays: 398, inclusive: true}
    certType: [leaf]
    requirement: must
    effective: {basis: issuance, until: 2026-03-15}
    message: "The Validity Period must not exceed 398 days"
  - id: br-subscriber-validity-max-397-days
    reference: CABF-BR 6.3.2
    target: certificate.validity
    operator: dateDiff
    operands:
      - {start: notBefore, end: notAfter, maxDays: 397, inclusive: true}
    certType: [leaf]
    requirement: should
    effective: {basis: issuance, until: 2026-03-15}
    message: "The Validity Period should not exceed 397 days"
  - id: br-subscriber-validity-max-200-days
