policy:
  - ../policies/ocsp-conditional-skip.yaml
  - ../policies/ocsp-good.yaml
  - ../policies/ocsp-missing-inconclusive.yaml
tests:
  - name: ocsp-conditional-skip
    cert: ../certs
    time: "2026-10-01T00:00:00Z"
    expect:
      - input: leaf
        policy: integration-ocsp-conditional-skip
        verdict: not_applicable
        failed: []
      - input: intermediate
        policy: integration-ocsp-conditional-skip
        verdict: not_applicable
        failed: []
      - input: root
        policy: integration-ocsp-conditional-skip
        verdict: not_applicable
        failed: []
  - name: ocsp-good-leaf
    cert: ../certs/ocsp-leaf.pem
    issuers: [../certs/ocsp-intermediate.pem, ../certs/ocsp-root.pem]
    ocsp: ../ocsps/good-leaf.ocsp
    time: "2026-10-01T00:00:00Z"
    expect:
      - input: leaf
        policy: integration-ocsp-good
        verdict: pass
        failed: []
      - input: intermediate
        policy: integration-ocsp-good
        verdict: not_applicable
        failed: []
      - input: root
        policy: integration-ocsp-good
        verdict: not_applicable
        failed: []
  - name: ocsp-issuer-mismatch-leaf
    cert: ../certs/ocsp-leaf.pem
    issuers: [../certs/ocsp-intermediate.pem, ../certs/ocsp-root.pem]
    ocsp: ../ocsps/issuer-mismatch-leaf.ocsp
    time: "2026-10-01T00:00:00Z"
    expect:
      - input: leaf
        policy: integration-ocsp-good
        verdict: fail
        failed: [ocsp-not-revoked, ocsp-response-valid, ocsp-status-good]
      - input: intermediate
        policy: integration-ocsp-good
        verdict: not_applicable
        failed: []
      - input: root
        policy: integration-ocsp-good
        verdict: not_applicable
        failed: []
  - name: ocsp-missing-inconclusive
    cert: ../certs
    time: "2026-10-01T00:00:00Z"
    expect:
      - input: leaf
        policy: integration-ocsp-missing-inconclusive
        verdict: inconclusive
        failed: []
        rules: {ocsp-valid: inconclusive}
      - input: intermediate
        policy: integration-ocsp-missing-inconclusive
        verdict: inconclusive
        failed: []
        rules: {ocsp-valid: inconclusive}
      - input: root
        policy: integration-ocsp-missing-inconclusive
        verdict: inconclusive
        failed: []
        rules: {ocsp-valid: inconclusive}
  - name: ocsp-mixed-good-revoked-leaf
    cert: ../certs/ocsp-leaf.pem
    issuers: [../certs/ocsp-intermediate.pem, ../certs/ocsp-root.pem]
