# yaml-language-server: $schema=https://raw.githubusercontent.com/cavoq/PCL/master/schemas/policy.schema.json
id: cabf-tls-br
version: "2.3.1-1"
metadata:
  title: TLS subscriber certificate profile and algorithms
  standard: CA/B Forum TLS Baseline Requirements
  edition: "2.3.1 (2026-10-04)"
  source: https://github.com/cabforum/servercert/blob/main/docs/BR.md
  description: >-
    Certificate-profile conformance for subscriber certificates (7.1.2.7),
    and the algorithm, key and name-encoding requirements for every
    certificate of the chain (6.1.5, 6.1.6, 7.1.3, 7.1.4). Combine with
    rfc5280. CA operations, validation and audits are out of scope; see
    CABF-TLS-BR-COVERAGE.md.
  inputs: [certificate, issuers, psl]
appliesTo: [cert]

rules:

  # -------------------------------------------------
  # Public keys (6.1.5, 6.1.6, 7.1.3.1); every certificate of the chain
  # -------------------------------------------------
  - id: br-spki-algorithm-encoding
    reference: CABF-BR 7.1.3.1
    target: certificate.subjectPublicKeyInfo.algorithm.rawDER
    operator: derEqualsHex
    operands:
      - "300d06092a864886f70d0101010500"  # rsaEncryption, NULL
      - "301306072a8648ce3d020106082a8648ce3d030107"  # P-256
      - "301006072a8648ce3d020106052b81040022"  # P-384
      - "301006072a8648ce3d020106052b81040023"  # P-521
    certType: [leaf, intermediate, root]
    requirement: must
    message: "The SubjectPublicKeyInfo AlgorithmIdentifier must be rsaEncryption with NULL, or id-ecPublicKey with P-256, P-384 or P-521"
  - id: br-rsa-key-size
    reference: CABF-BR 6.1.5
    when:
      target: certificate.subjectPublicKeyInfo.algorithm.oid
      operator: eq
      operands: ["1.2.840.113549.1.1.1"]
    target: certificate.subjectPublicKeyInfo.publicKey.keySize
    operator: gte
    operands: [2048]
    certType: [leaf, intermediate, root]
    requirement: must
    message: "RSA moduli must be at least 2048 bits"
  - id: br-rsa-key-size-multiple-of-8
    reference: CABF-BR 6.1.5
    when:
      target: certificate.subjectPublicKeyInfo.algorithm.oid
      operator: eq
      operands: ["1.2.840.113549.1.1.1"]
    target: certificate.subjectPublicKeyInfo.publicKey.keySize
    operator: multipleOf
    operands: [8]
    certType: [leaf, intermediate, root]
    requirement: must
    message: "RSA modulus sizes must be divisible by 8"
  - id: br-rsa-exponent-odd
    reference: CABF-BR 6.1.6
    when:
      target: certificate.subjectPublicKeyInfo.algorithm.oid
      operator: eq
      operands: ["1.2.840.113549.1.1.1"]
    target: certificate.subjectPublicKeyInfo.publicKey.exponent
    operator: odd
    certType: [leaf, intermediate, root]
    requirement: must
    message: "The RSA public exponent must be odd"
  - id: br-rsa-exponent-min
    reference: CABF-BR 6.1.6
    when:
      target: certificate.subjectPublicKeyInfo.algorithm.oid
      operator: eq
      operands: ["1.2.840.113549.1.1.1"]
    target: certificate.subjectPublicKeyInfo.publicKey.exponent
    operator: gte
    operands: [3]
    certType: [leaf, intermediate, root]
    requirement: must
    message: "The RSA public exponent must be at least 3"
  - id: br-rsa-exponent-range
    reference: CABF-BR 6.1.6
    when:
      target: certificate.subjectPublicKeyInfo.algorithm.oid
      operator: eq
      operands: ["1.2.840.113549.1.1.1"]
    target: certificate.subjectPublicKeyInfo.publicKey.exponent
    operator: gte
    operands: [65537]
    certType: [leaf, intermediate, root]
    requirement: should
    message: "The RSA public exponent should be at least 2^16 + 1"

  # -------------------------------------------------
  # Signature algorithms (7.1.3.2); every certificate of the chain
  # The outer signatureAlgorithm must equal this field (rfc5280 checks it).
  # The SHA-1 exception for re-issued CA certificates ended 2026-09-15.
  # -------------------------------------------------
  - id: br-signature-algorithm-encoding
    reference: CABF-BR 7.1.3.2
    target: certificate.tbsSignatureAlgorithm.rawDER
    operator: derEqualsHex
    operands:
      - "300d06092a864886f70d01010b0500"  # sha256WithRSAEncryption
      - "300d06092a864886f70d01010c0500"  # sha384WithRSAEncryption
      - "300d06092a864886f70d01010d0500"  # sha512WithRSAEncryption
      - "304106092a864886f70d01010a3034a00f300d06096086480165030402010500a11c301a06092a864886f70d010108300d06096086480165030402010500a203020120"  # RSASSA-PSS SHA-256
      - "304106092a864886f70d01010a3034a00f300d06096086480165030402020500a11c301a06092a864886f70d010108300d06096086480165030402020500a203020130"  # RSASSA-PSS SHA-384
      - "304106092a864886f70d01010a3034a00f300d06096086480165030402030500a11c301a06092a864886f70d010108300d06096086480165030402030500a203020140"  # RSASSA-PSS SHA-512
      - "300a06082a8648ce3d040302"  # ecdsa-with-SHA256
      - "300a06082a8648ce3d040303"  # ecdsa-with-SHA384
      - "300a06082a8648ce3d040304"  # ecdsa-with-SHA512
    certType: [leaf, intermediate, root]
    requirement: must
    message: "The signature AlgorithmIdentifier must be one of the permitted encodings"

  # -------------------------------------------------
  # Name encoding (7.1.4); every certificate of the chain
  # -------------------------------------------------
  - id: br-name-one-attribute-per-rdn
    reference: CABF-BR 7.1.4.1
    when:
      target: certificate.subject.rdns
      operator: notEmpty
    target: certificate.subject.rdns
    operator: every
    operands:
      - {path: "", operator: eq, operands: [1]}
    certType: [leaf, intermediate, root]
    requirement: must
    message: "Each RelativeDistinguishedName must contain exactly one AttributeTypeAndValue"
  - id: br-name-no-duplicate-attributes
    reference: CABF-BR 7.1.4.1
    target: certificate.subject
    operator: noDuplicateAttributes
    certType: [leaf, intermediate, root]
    requirement: must
    message: "A Name must not repeat an attribute that is not explicitly allowed to repeat"
  - id: br-subject-country-name-encoding
    reference: CABF-BR 7.1.4.2
    when:
      target: certificate.subject.countryName
      operator: present
    target: certificate.subject.countryName
    operator: every
    operands:
      - {path: encoding, operator: in, operands: [19]}
    certType: [leaf, intermediate, root]
    requirement: must
    message: "countryName must use PrintableString"
  - id: br-subject-country-name-length
    reference: CABF-BR 7.1.4.2
    when:
      target: certificate.subject.countryName
      operator: present
    target: certificate.subject.countryName
    operator: every
    operands:
      - {path: value, operator: maxLength, operands: [2]}
    certType: [leaf, intermediate, root]
    requirement: must
    message: "countryName must not exceed 2 characters"
  - id: br-subject-state-or-province-name-encoding
    reference: CABF-BR 7.1.4.2
    when:
      target: certificate.subject.stateOrProvinceName
      operator: present
    target: certificate.subject.stateOrProvinceName
    operator: every
    operands:
      - {path: encoding, operator: in, operands: [12, 19]}
    certType: [leaf, intermediate, root]
    requirement: must
    message: "stateOrProvinceName must use UTF8String or PrintableString"
  - id: br-subject-state-or-province-name-length
    reference: CABF-BR 7.1.4.2
    when:
      target: certificate.subject.stateOrProvinceName
      operator: present
    target: certificate.subject.stateOrProvinceName
    operator: every
    operands:
      - {path: value, operator: maxLength, operands: [128]}
    certType: [leaf, intermediate, root]
    requirement: must
    message: "stateOrProvinceName must not exceed 128 characters"
  - id: br-subject-locality-name-encoding
    reference: CABF-BR 7.1.4.2
    when:
      target: certificate.subject.localityName
      operator: present
    target: certificate.subject.localityName
